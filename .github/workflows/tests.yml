name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # Installs the five medfig skills and scipilot-medimg-figure-skill (the dependency medfig-render
      # calls) into ~/.claude/skills and ~/.codex/skills, exactly as a user would.
      - name: Install skills
        run: python install.py
      - name: Install fonts
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -qq && sudo apt-get install -y -qq ttf-mscorefonts-installer fonts-dejavu-core
          rm -rf ~/.cache/matplotlib
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
