name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "matplotlib==3.9.2" "numpy<2.2" "pandas<2.3" "scipy<1.15" "seaborn==0.13.2" \
                      "pyyaml==6.0.2" "pytest==8.3.3" "statsmodels==0.14.4" "scikit-learn==1.5.2"
      # Tests that need scipilot-medimg-figure-skill (a separate skill) are skipped when it is absent.
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
